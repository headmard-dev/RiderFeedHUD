    function getWkgZoneClass(wkg) {
      if (wkg >= 7.0) return 'z7';
      if (wkg >= 5.5) return 'z6';
      if (wkg >= 4.5) return 'z5';
      if (wkg >= 3.4) return 'z4';
      if (wkg >= 2.6) return 'z3';
      if (wkg >= 1.8) return 'z2';
      return 'z1';
    }

    function formatGapText(gapSec, isSelf) {
      if (isSelf) return 'YOU';
      if (gapSec == null || Number.isNaN(gapSec)) return '-';
      const sign = gapSec > 0 ? '+' : '';
      return `${sign}${gapSec.toFixed(1)}s`;
    }

    function renderRiders(nearbyList) {
      if (!Array.isArray(nearbyList) || nearbyList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 18px; color:#ffffff; font-weight:700;">Waiting for nearby riders in Zwift...</td></tr>`;
        return;
      }

      const nowMs = performance.now();

      const watchedEntry = nearbyList.find(r => r && r.watching);
      if (watchedEntry && watchedEntry.athlete) {
        updateDetectedSelfAthlete(watchedEntry.athlete);
      }

      const sorted = [...nearbyList].sort((a, b) => (a.gap ?? 0) - (b.gap ?? 0));

      const watchIdx = sorted.findIndex(r => r.watching);
      let startIdx = 0;
      if (watchIdx !== -1 && sorted.length > 16) {
        startIdx = Math.max(0, Math.min(watchIdx - 7, sorted.length - 16));
      }
      const visibleRiders = sorted.slice(startIdx, startIdx + 16);

      let nearestElasticSlipGap = null;
      let selfLiveWkg = null;

      const rowsHtml = visibleRiders.map((entry, rowIdx) => {
        const athlete = entry.athlete || {};
        const state = entry.state || {};
        const isSelf = Boolean(entry.watching);

        const name = athlete.sanitizedFullname || athlete.fullname ||
          ([athlete.firstName, athlete.lastName].filter(Boolean).join(' ').trim()) ||
          (isSelf && detectedSelfAthlete.name ? detectedSelfAthlete.name : `Rider #${entry.athleteId || ''}`);

        const rawWeight = athlete.weight ?? (isSelf ? detectedSelfAthlete.weight : null);
        const weight = (rawWeight != null && Number(rawWeight) > 0) ? Number(rawWeight) : null;

        const rawAge = athlete.age ?? (isSelf ? detectedSelfAthlete.age : null);
        const numericAge = (rawAge != null && Number(rawAge) > 0) ? Math.round(Number(rawAge)) : null;
        const ageDisplay = numericAge !== null ? numericAge : '—';

        const power = state.power != null ? Math.round(state.power) : 0;
        const wkg = (weight && weight > 0) ? (power / weight) : null;
        if (isSelf) selfLiveWkg = wkg;
        const zoneClass = wkg != null ? getWkgZoneClass(wkg) : 'z1';

        const riderKey = String(entry.athleteId ?? name);
        const attackInfo = evaluateRiderAttack(riderKey, wkg, nowMs);

        const hr = state.heartrate != null && state.heartrate > 0 ? Math.round(state.heartrate) : null;
        const maxHr = getRiderAgeComputedMaxHr(numericAge, isSelf);
        const z567ThresholdBpm = getRiderZone567ThresholdBpm(numericAge, isSelf);
        const hrZoneInfo = getRiderHrZoneInfo(hr, maxHr, z567ThresholdBpm);
        const isInZone567 = hrZoneInfo.isInZone567;

        const redSecondsRaw = updateRiderRedlineSeconds(riderKey, isInZone567, nowMs);
        const redSecondsInt = Math.round(redSecondsRaw);
        const redFillPct = Math.min(100, Math.round((redSecondsRaw / MAX_REDLINE_SECONDS) * 100));

        const draft = state.draft != null ? Math.round(state.draft) : 0;
        const climbPct = parseClimbGradePct(state.grade);
        const gap = entry.gap;
        const gapBaseClass = isSelf ? 'gap-self' : (gap < 0 ? 'gap-ahead' : 'gap-behind');

        // Evaluate Gap Split Velocity & Elastic Snap Warning
        const gapTrend = evaluateRiderGapTrend(riderKey, gap, isSelf, nowMs);
        if (gapTrend.isElasticSnapDanger && gap < 0 && (nearestElasticSlipGap === null || gap > nearestElasticSlipGap)) {
          nearestElasticSlipGap = gap;
        }

        const gapCellClasses = [gapBaseClass, gapTrend.cellDangerClass].filter(Boolean).join(' ');

        const rowClasses = [
          isSelf ? 'watching' : '',
          attackInfo.isAttacking ? 'rider-attack-row' : (isInZone567 ? 'hr-surge-row' : '')
        ].filter(Boolean).join(' ');

        const resizerFor = (colIdx) => rowIdx < 2 ? `<div class="row-col-resizer" data-col="${colIdx}" title="Drag to resize/concertina column"></div>` : '';
        const attackBadgeHtml = attackInfo.isAttacking ? `<span class="attack-tag">ATK</span>` : '';

        let riderCellHtml = '';

        if (isSelf) {
          const selfTone = getHrToneMetrics(hr, MIN_HR_BPM, maxHr);
          const barBg = getSpectrumBarBackground(selfTone.colorIdx, 0.94);
          const ambientBg = `linear-gradient(90deg, rgba(${selfTone.r},${selfTone.g},${selfTone.b},0.65) 0%, rgba(${selfTone.r},${selfTone.g},${selfTone.b},0.2) 100%)`;
          const glowShadow = `0 0 12px rgba(${selfTone.r},${selfTone.g},${selfTone.b},0.75)`;

          riderCellHtml = `
            <td class="col-rider self-full-bar-cell" title="${name} | Age: ${ageDisplay} -> Max HR: ${maxHr} bpm (${hrZoneInfo.zoneLabel}) | Z5/6/7 Redline: >=${z567ThresholdBpm} bpm | Colour ${selfTone.colorIdx + 1}/256">
              <div class="self-full-bar-ambient" style="background: ${ambientBg};"></div>
              <div class="self-full-bar-fill" style="width: ${selfTone.fillPct}%; background: ${barBg}; box-shadow: ${glowShadow};"></div>
              <div class="self-rider-label">
                <span>${name}${attackBadgeHtml}</span>
              </div>
              ${resizerFor(0)}
            </td>
          `;
        } else {
          const rivalTone = getHrToneMetrics(hr, MIN_HR_BPM, maxHr);
          const rivalBarBg = getSpectrumBarBackground(rivalTone.colorIdx, 0.95);
          const z5TickPct = Math.max(0, Math.min(100, Math.round(((z567ThresholdBpm - MIN_HR_BPM) / Math.max(10, maxHr - MIN_HR_BPM)) * 100)));
          const pctOfMax = hrZoneInfo.pctMax;

          riderCellHtml = `
            <td class="col-rider other-rider-cell" style="border-left: 3px solid ${hr !== null ? rivalTone.rgbCss : 'transparent'};" title="${name} | Age: ${ageDisplay} -> Max HR: ${maxHr} bpm (${pctOfMax ?? '—'}% Max, ${hrZoneInfo.zoneLabel}) | Z5/6/7 Trigger: >=${z567ThresholdBpm} bpm">
              <div class="other-rider-label">
                <span>${name}${attackBadgeHtml}</span>
              </div>
              <div class="other-hr-track">
                <div class="other-hr-fill" style="width: ${rivalTone.fillPct}%; background: ${rivalBarBg};"></div>
                <div class="other-hr-z3-tick" style="left: ${z5TickPct}%;" title="Zone 5/6/7 Redline Threshold (${z567ThresholdBpm} bpm)"></div>
              </div>
              ${resizerFor(0)}
            </td>
          `;
        }

        const redBoxClass = isInZone567
          ? 'red-timer-box flashing-z45'
          : (redSecondsInt > 0 ? 'red-timer-box cooling-down' : 'red-timer-box');

        const activeRedZoneBadge = isInZone567
          ? `<span class="red-zone-tag">${hrZoneInfo.zoneLabel}</span>`
          : '';

        const redCellHtml = `
          <td class="col-red-cell" title="Time in Zone 5/6/7 Redline (>= ${z567ThresholdBpm} bpm for Age ${ageDisplay}, Max HR ${maxHr} bpm | Current: ${hrZoneInfo.zoneLabel}): ${redSecondsInt}s / 120s">
            <div class="${redBoxClass}">
              <div class="red-timer-fill" style="width: ${redFillPct}%;"></div>
              <span class="red-timer-label">${activeRedZoneBadge}${redSecondsInt}s</span>
            </div>
            ${resizerFor(3)}
          </td>
        `;

        return `
          <tr class="${rowClasses}" title="${attackInfo.isAttacking ? attackInfo.attackReason : ''}">
            ${riderCellHtml}
            <td title="${wkg != null ? `${wkg.toFixed(2)} W/kg (${power}W)` : `${power}W`}">
              ${wkg != null ? `<span class="wkg-badge ${zoneClass}">${wkg.toFixed(2)}</span>` : '—'}
              ${resizerFor(1)}
            </td>
            <td title="Age ${ageDisplay} Formula Max HR: ${maxHr} bpm (${hrZoneInfo.zoneLabel}) | Zone 5/6/7 Redline: >=${z567ThresholdBpm} bpm">
              ${hr !== null
                ? `<span class="${isInZone567 ? 'hr-surge-badge' : ''}">${hr}</span><span class="sub-unit">bpm</span>`
                : '—'}
              ${resizerFor(2)}
            </td>
            ${redCellHtml}
            <td>${ageDisplay}${resizerFor(4)}</td>
            <td>${weight ? weight.toFixed(1) : '—'}<span class="sub-unit">kg</span>${resizerFor(5)}</td>
            <td class="${draft > 0 ? 'draft-active' : ''}">
              ${draft}<span class="sub-unit">W</span>${resizerFor(6)}
            </td>
            <td>${formatClimbHtml(climbPct)}${resizerFor(7)}</td>
            <td class="${gapCellClasses}" title="${gapTrend.tooltip}">
              <span>${formatGapText(gap, isSelf)}</span>${gapTrend.arrowHtml}${resizerFor(8)}
            </td>
          </tr>
        `;
      }).join('');

      updatePersonalPowerGauges(selfLiveWkg, nowMs);
      const ridersAhead = sorted.filter(r => !r.watching && (r.gap ?? 0) < 0);
      updateClimbWheelSitAdvisor(watchedEntry, ridersAhead, nearestElasticSlipGap);

      tbody.innerHTML = rowsHtml;
    }

    // 1. Primary Connection: Sauce Native Common Module
    async function initSauceConnection() {
      try {
        const common = await import('/pages/src/common.mjs');

        if (common.rpc && typeof common.rpc.getAthlete === 'function') {
          try {
            const selfData = await common.rpc.getAthlete('watching') || await common.rpc.getAthlete('self');
            if (selfData) updateDetectedSelfAthlete(selfData);
          } catch (e) {}
        }

        try {
          common.subscribe('athlete/watching', (data) => {
            if (data && data.athlete) updateDetectedSelfAthlete(data.athlete);
            else if (data) updateDetectedSelfAthlete(data);
          });
        } catch (e) {}

        common.subscribe('nearby', (data) => {
          if (demoMode) return;
          liveConnected = true;
          statusDot.className = 'status-dot live';
          statusText.textContent = `Live (${data.length})`;
          renderRiders(data);
        });
        statusDot.className = 'status-dot live';
        statusText.textContent = 'Connected';
        return;
      } catch (err) {
        connectDirectWebSocket();
      }
    }

    // 2. Fallback Connection: Direct Sauce WebSocket on localhost:1080
    function connectDirectWebSocket() {
      const wsHost = location.host || 'localhost:1080';
      const wsUrl = `ws://${wsHost}/api/ws/events`;
      let ws;

      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        return;
      }

      ws.addEventListener('open', () => {
        statusDot.className = 'status-dot live';
        statusText.textContent = 'WS Live';
        ws.send(JSON.stringify({
          type: 'request',
          uid: 'nearby-sub',
          data: { method: 'subscribe', arg: { event: 'nearby' } }
        }));
        ws.send(JSON.stringify({
          type: 'request',
          uid: 'watching-sub',
          data: { method: 'subscribe', arg: { event: 'athlete/watching' } }
        }));
      });

      ws.addEventListener('message', (msg) => {
        if (demoMode) return;
        try {
          const payload = JSON.parse(msg.data);
          if (payload.type === 'event' && payload.data) {
            if (Array.isArray(payload.data.data)) {
              liveConnected = true;
              statusDot.className = 'status-dot live';
              statusText.textContent = `Live (${payload.data.data.length})`;
              renderRiders(payload.data.data);
            } else if (payload.data.data && payload.data.data.athlete) {
              updateDetectedSelfAthlete(payload.data.data.athlete);
            }
          }
        } catch (err) {}
      });

      ws.addEventListener('close', () => {
        if (!demoMode) {
          statusDot.className = 'status-dot';
          statusText.textContent = 'Sauce Offline';
          setTimeout(connectDirectWebSocket, 4000);
        }
      });
    }

    function updateDemoTick() {
      demoTickCount += 1;
      const selfDemoAge = detectedSelfAthlete.age || 68;
      const selfDemoMaxHr = getRiderAgeComputedMaxHr(selfDemoAge, true);

      demoSelfHr += demoSelfHrDir;
      if (demoSelfHr >= selfDemoMaxHr) {
        demoSelfHr = selfDemoMaxHr;
        demoSelfHrDir = -3;
      } else if (demoSelfHr <= 75) {
        demoSelfHr = 75;
        demoSelfHrDir = 3;
      }

      demoClimbGrade += demoClimbDir;
      if (demoClimbGrade >= 0.095) {
        demoClimbGrade = 0.095;
        demoClimbDir = -0.005;
      } else if (demoClimbGrade <= -0.02) {
        demoClimbGrade = -0.02;
        demoClimbDir = 0.005;
      }

      const simulated = sampleRiders.map(r => {
        const wave = Math.sin((demoTickCount * 0.45) + r.gapPhase) * r.gapAmp;
        const rawGap = r.watching ? 0 : (r.baseGap < 0 ? Math.min(-0.2, r.baseGap + wave) : Math.max(0.2, r.baseGap + wave));
        return {
          athleteId: r.id,
          watching: !!r.watching,
          gap: r.watching ? 0 : +rawGap.toFixed(2),
          athlete: {
            sanitizedFullname: r.watching ? (detectedSelfAthlete.name || r.name) : r.name,
            weight: r.watching ? (detectedSelfAthlete.weight || r.weight) : r.weight,
            age: r.watching ? selfDemoAge : r.age
          },
          state: {
            power: Math.max(120, Math.round(r.basePwr + (Math.random() * 36 - 18))),
            heartrate: r.watching ? demoSelfHr : Math.round(r.baseHr + (Math.random() * 6 - 3)),
            draft: Math.max(0, Math.round(r.baseDraft + (Math.random() * 24 - 12))),
            grade: demoClimbGrade + (r.gradeOffset || 0)
          }
        };
      });
      renderRiders(simulated);
    }

    demoBtn.addEventListener('click', toggleDemoMode);
    initSauceConnection();
  </script>
</body>
</html>
